<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Library</title>
<style>
  :root {
    --bg: #f7f3ec; --card: #fffdf9; --text: #2a2622; --muted: #756c61; --line: #e6ddcf;
    --accent: #7a3e2b; --accent-soft: #f1e4dc; --accent-text: #fff; --ok: #2f6b4f; --err: #a12a1b;
    --shadow: 0 1px 2px rgba(60,40,20,.08), 0 4px 14px rgba(60,40,20,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1714; --card: #24201c; --text: #eee7dd; --muted: #a99f92; --line: #3a332c;
            --accent: #e09a7c; --accent-soft: #3a2a23; --accent-text: #1a1714; --ok: #7fc8a3; --err: #ff8f80;
            --shadow: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
  .brand { font-family: Georgia, serif; font-size: 22px; font-weight: 600; margin-right: auto; white-space: nowrap; }
  nav { display: flex; gap: 4px; }
  nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
  h2 { font-family: Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text], input[type=url], input[type=email], input[type=password], input[type=search], input[type=number], select, textarea {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
  textarea { width: 100%; min-height: 120px; resize: vertical; }
  .grow { flex: 1; }
  .btn { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent);
         color: var(--accent-text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.quiet { background: transparent; border-color: var(--line); color: var(--text); }
  .btn.big { padding: 12px 18px; font-size: 16px; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); padding: 5px 12px; border-radius: 99px; cursor: pointer; color: var(--muted); }
  .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .tools input[type=search] { flex: 1 1 220px; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 18px; }
  .shelf > * { min-width: 0; }
  @media (max-width: 520px) { .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; } }
  .tile { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; width: 100%; display: block; }
  .cover { aspect-ratio: 2/3; width: 100%; border-radius: 4px 8px 8px 4px; box-shadow: var(--shadow); overflow: hidden;
           position: relative; background: var(--accent-soft); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .fake { position: absolute; inset: 0; padding: 12% 10%; display: flex; flex-direction: column; justify-content: space-between;
                 font-family: Georgia, serif; color: #fff; border-left: 6px solid rgba(0,0,0,.18); }
  .cover .fake b { font-size: clamp(12px, 3.2vw, 17px); line-height: 1.2; overflow-wrap: anywhere; }
  .cover .fake span { font-size: 12px; opacity: .85; }
  .cover .badge { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 99px; }
  .cover .heart { position: absolute; top: 4px; left: 8px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 16px; }
  .cover.busy::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.55); }
  .cover.busy .spin { position: absolute; z-index: 1; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px; border-radius: 50%;
                      border: 3px solid var(--accent); border-right-color: transparent; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tile .t { font-weight: 600; margin-top: 8px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile .a { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .err { color: var(--err); font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  /* Book sheet */
  .scrim { position: fixed; inset: 0; background: rgba(20,14,8,.45); z-index: 10; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 32px 16px; }
  .sheet { background: var(--card); border-radius: 14px; max-width: 760px; width: 100%; padding: 22px; position: relative; }
  .sheet .close { position: absolute; top: 10px; right: 10px; border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 6px 10px; }
  .detail { display: grid; grid-template-columns: 180px 1fr; gap: 22px; }
  @media (max-width: 600px) { .detail { grid-template-columns: 1fr; } .detail .cover { max-width: 180px; margin: 0 auto; } }
  .detail h2 { font-size: 26px; margin: 0; padding-right: 28px; }
  .detail .by { font-size: 17px; color: var(--muted); margin: 2px 0 10px; }
  .desc { white-space: pre-line; margin: 14px 0; max-height: 280px; overflow-y: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: none; padding: 7px 12px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--line); }
  .meta-line { font-size: 13px; color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin: 0 4px 4px 0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .form-grid .full { grid-column: 1 / -1; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  .results { display: grid; gap: 8px; margin-top: 14px; }
  .result { display: flex; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
  .result img, .result .ph { width: 44px; height: 66px; object-fit: cover; border-radius: 3px; background: var(--accent-soft); flex: none; }
  .result .grow { min-width: 0; }
  .result .t { font-weight: 600; overflow-wrap: anywhere; }
  .notice { padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); margin-bottom: 16px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 18px; border-radius: 99px; z-index: 20; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
  .users td, .users th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .users { border-collapse: collapse; width: 100%; font-size: 14px; }
  code { background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
  @media (max-width: 560px) { .brand { font-size: 17px; } nav a { padding: 5px 8px; font-size: 14px; } .bar { gap: 6px; padding: 10px 12px; } .brand .ico { display: none; } }
  @media (max-width: 460px) { .bar { flex-wrap: wrap; } .brand { width: 100%; } nav { width: 100%; justify-content: space-between; } }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.done { border-color: var(--ok); color: var(--ok); } .pill.error { border-color: var(--err); color: var(--err); }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span class="ico">📚 </span>Our Library</div>
  <nav>
    <a href="#/" data-v="shelf">Shelf</a>
    <a href="#/add" data-v="add">Add books</a>
    <a href="#/audio" data-v="audio">Audiobooks</a>
    <a href="#/settings" data-v="settings">Settings</a>
  </nav>
</div></header>
<main id="view"></main>
<div id="sheet"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BUSY = ["queued", "downloading", "converting"];
const STATUS = { want: "Want to read", reading: "Reading", finished: "Finished" };
let me = null, cfg = {}, books = [], filter = load("filter", "all"), sortBy = load("sort", "added"), query = "";

function load(k, d) { try { return localStorage.getItem("ks_" + k) || d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem("ks_" + k, v); } catch {} }

async function api(path, opts = {}) {
  if (opts.json !== undefined) { opts.body = JSON.stringify(opts.json); opts.headers = {"Content-Type": "application/json"}; }
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login"; throw new Error("Please log in"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : "Something went wrong");
  return body;
}
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function coverHTML(b, extra = "") {
  const busy = BUSY.includes(b.status);
  const img = b.has_cover ? `<img src="/books/${b.id}/cover?v=${b.cover_v}" alt="" loading="lazy">`
    : `<div class="fake" style="background:hsl(${hue(b.title)} 35% 38%)"><b>${esc(b.title)}</b><span>${esc(b.author || "")}</span></div>`;
  return `<div class="cover ${busy ? "busy" : ""}">${img}${busy ? '<div class="spin"></div>' : ""}${extra}</div>`;
}

// ---------------------------------------------------------------- shelf
function visibleBooks() {
  const q = query.trim().toLowerCase();
  let list = books.filter(b => {
    if (filter === "fav" && !b.favorite) return false;
    if (["want", "reading", "finished"].includes(filter) && b.read_status !== filter) return false;
    if (filter === "unread" && b.read_status) return false;
    if (!q) return true;
    return [b.title, b.author, b.series, ...(b.tags || [])].some(v => (v || "").toLowerCase().includes(q));
  });
  const key = { title: b => (b.title || "").replace(/^(the|a|an) /i, ""), author: b => lastName(b.author),
                series: b => (b.series || "~") + String(b.series_index ?? 0).padStart(6, "0") };
  if (key[sortBy]) list.sort((a, b) => key[sortBy](a).localeCompare(key[sortBy](b)));
  return list;
}
function lastName(a) { a = (a || "~").split("&")[0].trim(); return a.split(" ").slice(-1)[0] + " " + a; }

function renderShelf() {
  const v = $("#view");
  if (!$("#shelfTools")) {
    v.innerHTML = `
      ${!me.kindle_email ? `<div class="notice">👋 Add your Kindle email address in <a href="#/settings">Settings</a> so books can be sent straight to your Kindle.</div>` : ""}
      <div class="tools" id="shelfTools">
        <input type="search" id="q" placeholder="Search titles, authors, series…" value="${esc(query)}">
        <select id="sort" aria-label="Sort">
          <option value="added">Recently added</option><option value="title">Title</option>
          <option value="author">Author</option><option value="series">Series</option>
        </select>
      </div>
      <div class="chips" id="filters" style="margin:-6px 0 20px"></div>
      <div id="shelf"></div>`;
    $("#q").oninput = e => { query = e.target.value; drawShelf(); };
    $("#sort").value = sortBy;
    $("#sort").onchange = e => { sortBy = e.target.value; save("sort", sortBy); drawShelf(); };
  }
  drawShelf();
}
function drawShelf() {
  const counts = { all: books.length, reading: 0, want: 0, finished: 0, unread: 0, fav: 0 };
  books.forEach(b => { if (b.read_status) counts[b.read_status]++; else counts.unread++; if (b.favorite) counts.fav++; });
  const F = [["all","All"],["reading","Reading"],["want","Want to read"],["finished","Finished"],["unread","Not started"],["fav","♥ Favorites"]];
  $("#filters").innerHTML = F.map(([k, l]) => `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${l} <span class="muted">${counts[k]}</span></button>`).join("");
  $("#filters").querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.f; save("filter", filter); drawShelf(); });
  const list = visibleBooks();
  if (!books.length) { $("#shelf").innerHTML = `<div class="empty">The shelf is empty.<br><br><a class="btn" href="#/add">Add your first book</a></div>`; return; }
  if (!list.length) { $("#shelf").innerHTML = `<div class="empty">No books match.</div>`; return; }
  $("#shelf").innerHTML = `<div class="shelf">${list.map(b => {
    const badge = b.status === "error" ? '<span class="badge">Problem</span>'
      : BUSY.includes(b.status) ? '<span class="badge">Adding…</span>'
      : b.read_status ? `<span class="badge">${STATUS[b.read_status]}</span>` : "";
    return `<button class="tile" data-id="${b.id}">
      ${coverHTML(b, badge + (b.favorite ? '<span class="heart">♥</span>' : ""))}
      <div class="t">${esc(b.title)}</div>
      <div class="a">${esc(b.author || "")}</div>
      ${b.status === "error" ? `<div class="err">Couldn't add</div>` : ""}
    </button>`; }).join("")}</div>`;
  $("#shelf").querySelectorAll(".tile").forEach(t => t.onclick = () => location.hash = "#/book/" + t.dataset.id);
}

// ---------------------------------------------------------------- book sheet
let editing = false, shown = "";
function closeSheet() { $("#sheet").innerHTML = ""; editing = false; shown = ""; if (location.hash.startsWith("#/book/")) history.back(); }
function renderBook(id) {
  const b = books.find(x => x.id === id);
  if (!b) { $("#sheet").innerHTML = ""; return; }
  if (editing) return;
  const sig = JSON.stringify([b, me.kindle_email, cfg.email_ready]);
  if (sig === shown && $("#scrim")) return;  // nothing changed; keep scroll position
  shown = sig;
  const busy = BUSY.includes(b.status), done = b.status === "done";
  const canDelete = me.is_admin || b.added_by_id === me.id;
  const series = b.series ? `${esc(b.series)}${b.series_index != null ? " #" + (+b.series_index) : ""}` : "";
  $("#sheet").innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="${esc(b.title)}">
    <button class="close" id="x" aria-label="Close">✕</button>
    <div class="detail">
      <div>${coverHTML(b)}</div>
      <div>
        <h2>${esc(b.title)}</h2>
        <div class="by">${esc(b.author || "Unknown author")}</div>
        ${series ? `<div class="meta-line">Series: ${series}</div>` : ""}
        ${busy ? `<p class="muted">${esc(b.message)}</p>` : ""}
        ${b.status === "error" ? `<p style="color:var(--err)">${esc(b.message)}</p>
            <div class="row"><button class="btn" id="retry">Try again</button>${canDelete ? '<button class="btn quiet" id="del">Remove</button>' : ""}</div>` : ""}
        ${done ? `
          <div class="row" style="margin:14px 0">
            <button class="btn big" id="send" ${me.kindle_email && cfg.email_ready ? "" : "disabled"}>${b.sent_at ? "Send to my Kindle again" : "Send to my Kindle"}</button>
            <button class="btn quiet" id="fav" aria-pressed="${b.favorite}">${b.favorite ? "♥ Favorite" : "♡ Favorite"}</button>
          </div>
          ${b.sent_at ? `<div class="meta-line">✓ Sent to your Kindle ${new Date(b.sent_at * 1000).toLocaleDateString()}</div>` : ""}
          ${!me.kindle_email ? `<div class="meta-line">Add your Kindle email in <a href="#/settings">Settings</a> to send books.</div>`
            : !cfg.email_ready ? `<div class="meta-line">Email isn't set up yet. Ask the admin to set it up in Settings.</div>` : ""}
          <div style="margin:16px 0 4px" class="meta-line">My status</div>
          <div class="seg" id="seg">${["want","reading","finished"].map(s => `<button data-s="${s}" class="${b.read_status === s ? "on" : ""}">${STATUS[s]}</button>`).join("")}</div>
          ${b.description ? `<div class="desc">${esc(b.description)}</div>` : `<p class="muted">No description.</p>`}
          <div>${(b.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
          <div class="meta-line" style="margin-top:10px">${[b.published && "Published " + esc(b.published), b.added_by && "Added by " + esc(b.added_by), "Added " + new Date(b.created * 1000).toLocaleDateString()].filter(Boolean).join(" · ")}</div>
          <div class="row" style="margin-top:16px">
            ${b.formats.map(f => `<a class="btn quiet" href="/books/${b.id}/file/${f}">Download ${f.toUpperCase()}</a>`).join("")}
            <button class="btn quiet" id="edit">Edit details</button>
            ${canDelete ? '<button class="btn quiet" id="del">Remove</button>' : ""}
          </div>` : ""}
      </div>
    </div></div></div>`;
  $("#x").onclick = closeSheet;
  $("#scrim").onclick = e => { if (e.target.id === "scrim") closeSheet(); };
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
  on("#send", async e => {
    e.target.disabled = true; e.target.textContent = "Sending…";
    try { await api(`/api/books/${id}/send`, { method: "POST" }); toast("Sent! It should appear on your Kindle in a few minutes."); await refresh(); }
    catch (err) { toast(err.message); e.target.disabled = false; e.target.textContent = "Send to my Kindle"; }
  });
  on("#fav", () => setState(id, { favorite: !b.favorite }));
  document.querySelectorAll("#seg button").forEach(btn => btn.onclick = () =>
    setState(id, { read_status: b.read_status === btn.dataset.s ? null : btn.dataset.s }));
  on("#edit", () => renderEdit(b));
  on("#retry", async () => { try { await api(`/api/books/${id}/retry`, { method: "POST" }); closeSheet(); toast("Trying again…"); refresh(); } catch (err) { toast(err.message); } });
  on("#del", async () => {
    if (!confirm(`Remove "${b.title}" from the library? This deletes its files from the server.`)) return;
    try { await api(`/api/books/${id}`, { method: "DELETE" }); closeSheet(); toast("Removed"); refresh(); } catch (err) { toast(err.message); }
  });
}
async function setState(id, data) {
  try { await api(`/api/books/${id}/state`, { method: "PUT", json: data }); await refresh(); } catch (err) { toast(err.message); }
}
function renderEdit(b) {
  editing = true;
  $(".sheet .detail").outerHTML = `<form id="editForm"><h2 style="margin-bottom:14px">Edit details</h2>
    <div class="form-grid">
      <label class="full">Title<input type="text" name="title" value="${esc(b.title)}" required></label>
      <label class="full">Author<input type="text" name="author" value="${esc(b.author || "")}" placeholder="Separate several authors with &"></label>
      <label>Series<input type="text" name="series" value="${esc(b.series || "")}"></label>
      <label>Number in series<input type="number" step="0.1" name="series_index" value="${b.series_index ?? ""}"></label>
      <label class="full">Description<textarea name="description">${esc(b.description || "")}</textarea></label>
      <label class="full">New cover image (JPG or PNG)<input type="file" name="cover" accept="image/jpeg,image/png"></label>
    </div>
    <p class="meta-line">Changes are saved into the book files too, so the Kindle shows them the next time you send the book.</p>
    <div class="row"><button class="btn">Save</button><button type="button" class="btn quiet" id="cancel">Cancel</button></div></form>`;
  $("#cancel").onclick = () => { editing = false; shown = ""; renderBook(b.id); };
  $("#editForm").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const idx = f.get("series_index");
    try {
      await api(`/api/books/${b.id}`, { method: "PATCH", json: { title: f.get("title"), author: f.get("author"),
        series: f.get("series"), series_index: idx === "" ? null : +idx, description: f.get("description") } });
      const file = f.get("cover");
      if (file && file.size) { const fd = new FormData(); fd.append("file", file); await api(`/api/books/${b.id}/cover`, { method: "POST", body: fd }); }
      editing = false; shown = ""; toast("Saved"); await refresh();
    } catch (err) { toast(err.message); }
  };
}

// ---------------------------------------------------------------- add books
function renderAdd() {
  const sendDefault = me.auto_send && me.kindle_email && cfg.email_ready;
  const sendBox = `<label class="row muted" style="font-size:14px;width:100%"><input type="checkbox" class="sendChk" ${sendDefault ? "checked" : ""} ${me.kindle_email && cfg.email_ready ? "" : "disabled"}> Also send to my Kindle when it's ready</label>`;
  $("#view").innerHTML = `
    <div class="card">
      <h2>Find a free classic</h2>
      <p class="muted" style="margin-top:-6px">Search more than 70,000 free public-domain books from Project Gutenberg.</p>
      <form id="searchForm" class="row"><input type="search" id="sq" class="grow" placeholder="Title or author, e.g. Jane Austen" required><button class="btn">Search</button></form>
      <div class="row" style="margin-top:8px">${sendBox}</div>
      <div id="results" class="results"></div>
    </div>
    <div class="card">
      <h2>Upload a book you have</h2>
      <p class="muted" style="margin-top:-6px">EPUB, MOBI, AZW3, PDF, DOCX and more. It will be converted for Kindle.</p>
      <form id="uploadForm" class="row"><input type="file" id="file" class="grow" required multiple accept="${[".epub",".mobi",".azw",".azw3",".prc",".pdf",".fb2",".txt",".html",".htm",".docx",".rtf",".odt",".lit",".cbz",".cbr",".pdb"].join(",")}"><button class="btn">Upload</button>${sendBox}</form>
    </div>
    <div class="card">
      <h2>Add from a link</h2>
      <p class="muted" style="margin-top:-6px">Paste a direct link to an ebook file.</p>
      <form id="urlForm" class="row"><input type="url" id="url" class="grow" placeholder="https://…/book.epub" required><button class="btn">Add</button>${sendBox}</form>
    </div>
    ${me.is_admin && cfg.import_dir ? `<div class="card"><h3>Import folder on the server</h3>
      <p class="muted">Copy ebook files into <code>${esc(cfg.import_dir)}</code> and they're added automatically within a minute.</p>
      <button class="btn quiet" id="scan">Check the folder now</button></div>` : ""}`;
  const sendOf = form => form.querySelector(".sendChk")?.checked || false;
  $("#searchForm").onsubmit = async e => {
    e.preventDefault();
    const box = $("#results"); box.innerHTML = '<div class="muted">Searching…</div>';
    try {
      const data = await api("/api/search?q=" + encodeURIComponent($("#sq").value));
      if (!data.results.length) { box.innerHTML = '<div class="muted">No matches.</div>'; return; }
      box.innerHTML = data.results.map(r => `<div class="result">
        ${r.cover ? `<img src="${esc(r.cover)}" alt="" loading="lazy">` : '<div class="ph"></div>'}
        <div class="grow"><div class="t">${esc(r.title)}</div><div class="muted" style="font-size:13px">${esc(r.authors || "Unknown author")}</div></div>
        ${r.in_library ? `<a class="btn quiet" href="#/book/${r.in_library}">On the shelf</a>`
          : `<button class="btn" data-g="${r.id}" ${r.epub ? "" : "disabled"}>Add</button>`}</div>`).join("");
      box.querySelectorAll("[data-g]").forEach(btn => btn.onclick = async () => {
        btn.disabled = true; btn.textContent = "Adding…";
        try { await api("/api/books", { method: "POST", json: { gutenberg_id: +btn.dataset.g, send: sendOf($("#searchForm").parentElement) } });
              btn.textContent = "Added ✓"; toast("Added. It'll be on the shelf in a minute or two."); refresh(); }
        catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Add"; }
      });
    } catch (err) { box.innerHTML = `<div class="muted">${esc(err.message)}</div>`; }
  };
  $("#uploadForm").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true;
    const files = [...$("#file").files];
    try {
      for (const [i, file] of files.entries()) {
        btn.textContent = `Uploading ${i + 1} of ${files.length}…`;
        const fd = new FormData(); fd.append("file", file); fd.append("send", sendOf(e.target));
        await api("/api/books/upload", { method: "POST", body: fd });
      }
      $("#file").value = ""; toast("Uploaded. Find it on the shelf."); refresh();
    } catch (err) { toast(err.message); }
    finally { btn.disabled = false; btn.textContent = "Upload"; }
  };
  $("#urlForm").onsubmit = async e => {
    e.preventDefault();
    try { await api("/api/books", { method: "POST", json: { url: $("#url").value, send: sendOf(e.target) } });
          $("#url").value = ""; toast("Added. Find it on the shelf."); refresh(); }
    catch (err) { toast(err.message); }
  };
  if ($("#scan")) $("#scan").onclick = async () => {
    try { const r = await api("/api/import/scan", { method: "POST" }); toast(r.added ? `Found ${r.added} new book(s)` : "No new files in the folder"); refresh(); }
    catch (err) { toast(err.message); }
  };
}

// ---------------------------------------------------------------- audiobooks
let audioTimer = null;
function fmtSize(b) { return b ? (b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.round(b / 1e6) + " MB") : ""; }
async function renderAudio() {
  $("#view").innerHTML = `
    <div class="card">
      <h2>Find a free audiobook</h2>
      <p class="muted" style="margin-top:-6px">Search LibriVox and the Internet Archive's free audiobooks (public-domain classics read by volunteers). Downloads go straight into Audiobookshelf.</p>
      <form id="aSearch" class="row"><input type="search" id="aq" class="grow" placeholder="Title or author, e.g. Sherlock Holmes" required><button class="btn">Search</button></form>
      <div id="aResults" class="results"></div>
    </div>
    <div class="card">
      <h2>Upload an audiobook you have</h2>
      <p class="muted" style="margin-top:-6px">DRM-free files only, e.g. from Libro.fm or Downpour: MP3, M4B, M4A, FLAC, OGG, or one ZIP. Pick all the files for one book at once.</p>
      <form id="aUpload" class="form-grid">
        <label>Title<input type="text" name="title" required></label>
        <label>Author<input type="text" name="author"></label>
        <label>Narrator (optional)<input type="text" name="narrator"></label>
        <label>Files<input type="file" name="files" multiple required accept=".mp3,.m4b,.m4a,.aac,.flac,.ogg,.opus,.wma,.wav,.zip,.jpg,.jpeg,.png"></label>
        <div class="full"><button class="btn">Upload</button></div>
      </form>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 style="margin:0">Recent audiobook downloads</h2><span id="absLink"></span></div>
      <div id="aList" class="results"></div>
    </div>`;
  $("#aSearch").onsubmit = async e => {
    e.preventDefault();
    const box = $("#aResults"); box.innerHTML = '<div class="muted">Searching…</div>';
    try {
      const data = await api("/api/audiobooks/search?q=" + encodeURIComponent($("#aq").value));
      if (!data.results.length) { box.innerHTML = '<div class="muted">No matches.</div>'; return; }
      box.innerHTML = data.results.map(r => `<div class="result">
        <img src="${esc(r.cover)}" alt="" loading="lazy">
        <div class="grow"><div class="t">${esc(r.title)}</div>
          <div class="muted" style="font-size:13px">${esc(r.author || "Unknown author")} · ${r.librivox ? "LibriVox" : "Internet Archive"} · <a href="${esc(r.page)}" target="_blank" rel="noopener">listen to a sample</a></div></div>
        ${r.in_library ? `<span class="pill done">Downloaded</span>` : `<button class="btn" data-a="${esc(r.id)}">Download</button>`}</div>`).join("");
      box.querySelectorAll("[data-a]").forEach(btn => btn.onclick = async () => {
        btn.disabled = true; btn.textContent = "Starting…";
        try { const r = await api("/api/audiobooks", { method: "POST", json: { identifier: btn.dataset.a } });
              btn.textContent = r.existing ? "Already have it" : "Downloading"; drawAudioList(); }
        catch (err) { toast(err.message); btn.disabled = false; btn.textContent = "Download"; }
      });
    } catch (err) { box.innerHTML = `<div class="muted">${esc(err.message)}</div>`; }
  };
  $("#aUpload").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Uploading… (large files take a while)";
    try { await api("/api/audiobooks/upload", { method: "POST", body: new FormData(e.target) }); e.target.reset(); toast("Uploaded"); drawAudioList(); }
    catch (err) { toast(err.message); }
    finally { btn.disabled = false; btn.textContent = "Upload"; }
  };
  drawAudioList();
  clearInterval(audioTimer);
  audioTimer = setInterval(() => { if (current === "audio") drawAudioList(); else clearInterval(audioTimer); }, 4000);
}
async function drawAudioList() {
  const data = await api("/api/audiobooks");
  if (!$("#aList")) return;
  $("#absLink").innerHTML = data.abs_url ? `<a class="btn quiet" href="${esc(data.abs_url)}" target="_blank" rel="noopener">Open Audiobookshelf ↗</a>` : "";
  if (!data.items.length) { $("#aList").innerHTML = '<div class="muted">Nothing yet.</div>'; return; }
  $("#aList").innerHTML = data.items.slice(0, 30).map(a => {
    const canDel = me.is_admin || a.added_by_id === me.id;
    return `<div class="result"><div class="grow">
      <div class="t">${esc(a.title || "Looking up…")} <span class="pill ${a.status}">${a.status === "done" ? "ready" : a.status}</span></div>
      <div class="muted" style="font-size:13px">${esc([a.author, a.narrator && "read by " + a.narrator, a.file_count && a.file_count + " file" + (a.file_count > 1 ? "s" : ""), fmtSize(a.size), a.added_by && "added by " + a.added_by].filter(Boolean).join(" · "))}</div>
      <div style="font-size:13px;color:${a.status === "error" ? "var(--err)" : "var(--muted)"}">${esc(a.message || "")}</div>
      ${me.is_admin && a.path ? `<div class="meta-line"><code>${esc(a.path)}</code></div>` : ""}</div>
      ${canDel && !["queued","downloading"].includes(a.status) ? `<button class="btn quiet" data-forget="${a.id}" title="Remove from this list (files stay in Audiobookshelf)">✕</button>` : ""}</div>`;
  }).join("");
  $("#aList").querySelectorAll("[data-forget]").forEach(b => b.onclick = async () => {
    try { await api(`/api/audiobooks/${b.dataset.forget}`, { method: "DELETE" }); drawAudioList(); } catch (err) { toast(err.message); }
  });
}

// ---------------------------------------------------------------- settings
async function renderSettings() {
  $("#view").innerHTML = `
    <div class="card">
      <h2>My account</h2>
      <form id="meForm" class="form-grid">
        <label>Name<input type="text" name="name" value="${esc(me.name)}"></label>
        <label>Username<input type="text" value="${esc(me.username)}" disabled></label>
        <label class="full">My Kindle email address
          <input type="email" name="kindle_email" value="${esc(me.kindle_email || "")}" placeholder="yourname_abc123@kindle.com"></label>
        <div class="full meta-line">Find it on Amazon: <b>Account → Manage Your Content and Devices → Preferences → Personal Document Settings</b>.
          On that same page, add <b>${esc(cfg.send_from || "the library's sending address")}</b> to the <b>Approved Personal Document E-mail List</b>, or Amazon will ignore the emails.</div>
        <label class="full row" style="flex-direction:row;color:var(--text)"><input type="checkbox" name="auto_send" ${me.auto_send ? "checked" : ""}> Send books I add to my Kindle automatically</label>
        <div class="full"><button class="btn">Save</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Change password</h3>
      <form id="pwForm" class="row">
        <input type="password" name="current" placeholder="Current password" required autocomplete="current-password">
        <input type="password" name="new" placeholder="New password (6+ characters)" minlength="6" required autocomplete="new-password">
        <button class="btn quiet">Change</button>
      </form>
    </div>
    <div class="card">
      <h3>On the Kindle itself</h3>
      <p class="muted">Open the Kindle's web browser and go to <code>${esc(location.origin)}/kindle</code>, log in, and tap any book to download it straight onto the Kindle. No email needed.</p>
      <a class="btn quiet" href="/logout">Log out</a>
    </div>
    <div id="admin"></div>`;
  $("#meForm").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { me = await api("/api/me", { method: "PUT", json: { name: f.get("name"), kindle_email: f.get("kindle_email"), auto_send: !!f.get("auto_send") } }); toast("Saved"); }
    catch (err) { toast(err.message); }
  };
  $("#pwForm").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await api("/api/me", { method: "PUT", json: { current_password: f.get("current"), new_password: f.get("new") } }); e.target.reset(); toast("Password changed"); }
    catch (err) { toast(err.message); }
  };
  if (me.is_admin) renderAdmin();
}

async function renderAdmin() {
  const [users, mail, aud] = await Promise.all([api("/api/users"), api("/api/settings/email"), api("/api/settings/audio")]);
  $("#admin").innerHTML = `
    <div class="card">
      <h2>People</h2>
      <table class="users"><tr><th>Name</th><th>Username</th><th>Kindle email</th><th></th></tr>
        ${users.map(u => `<tr><td>${esc(u.name)}${u.is_admin ? ' <span class="tag">admin</span>' : ""}</td><td>${esc(u.username)}</td>
          <td>${esc(u.kindle_email || "—")}</td><td style="text-align:right;white-space:nowrap">
          <button class="btn quiet" data-reset="${u.id}">Reset password</button>
          ${u.id !== me.id ? `<button class="btn quiet" data-del="${u.id}">Remove</button>` : ""}</td></tr>`).join("")}
      </table>
      <h3 style="margin-top:18px">Add a person</h3>
      <form id="userForm" class="form-grid">
        <label>Name<input type="text" name="name" required placeholder="e.g. Sarah"></label>
        <label>Username<input type="text" name="username" required autocapitalize="none"></label>
        <label>Password<input type="text" name="password" required minlength="6"></label>
        <label>Their Kindle email (optional)<input type="email" name="kindle_email"></label>
        <label class="full row" style="flex-direction:row;color:var(--text)"><input type="checkbox" name="is_admin"> Can manage people and email settings</label>
        <div class="full"><button class="btn">Add person</button></div>
      </form>
    </div>
    <div class="card">
      <h2>Email for Send to Kindle</h2>
      <p class="muted" style="margin-top:-6px">The library emails books to Kindles from this account. With Gmail, turn on 2-step verification and create an <b>app password</b> at myaccount.google.com/apppasswords. Use that here, not your normal password.</p>
      <form id="mailForm" class="form-grid">
        <label>Mail server<input type="text" name="smtp_host" value="${esc(mail.smtp_host || "")}" placeholder="smtp.gmail.com"></label>
        <label>Port<input type="text" name="smtp_port" value="${esc(mail.smtp_port || "587")}"></label>
        <label>Security<select name="smtp_security">${["starttls","ssl","none"].map(s => `<option ${mail.smtp_security === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
        <label>Send from address<input type="email" name="smtp_from" value="${esc(mail.smtp_from || "")}" placeholder="library@gmail.com"></label>
        <label>Login username<input type="text" name="smtp_user" value="${esc(mail.smtp_user || "")}" placeholder="library@gmail.com"></label>
        <label>Password${mail.has_password ? " (saved; leave blank to keep)" : ""}<input type="password" name="smtp_password" autocomplete="new-password"></label>
        <div class="full row"><button class="btn">Save</button><button type="button" class="btn quiet" id="testMail">Send a test email</button></div>
      </form>
    </div>
    <div class="card">
      <h2>Audiobookshelf</h2>
      <p class="muted" style="margin-top:-6px">Audiobooks are saved as <code>Author\\Title\\</code> inside this folder. Use the folder your Audiobookshelf library already watches (Audiobookshelf → Settings → Libraries → edit → Folders).</p>
      <form id="audForm" class="form-grid">
        <label class="full">Audiobook folder on this server<input type="text" name="audiobook_dir" value="${esc(aud.audiobook_dir || "")}" placeholder="D:\\Audiobooks"></label>
        <label>Download quality<select name="audio_quality">
          <option value="small" ${aud.audio_quality === "small" ? "selected" : ""}>Smaller files (64 kbps, fine for speech)</option>
          <option value="high" ${aud.audio_quality === "high" ? "selected" : ""}>Higher quality (bigger files)</option></select></label>
        <label>Audiobookshelf address (optional)<input type="url" name="abs_url" value="${esc(aud.abs_url || "")}" placeholder="http://localhost:13378"></label>
        <label class="full">API key (optional, makes new books appear instantly)${aud.has_token ? " (saved; leave blank to keep)" : ""}
          <input type="password" name="abs_token" autocomplete="off" placeholder="Audiobookshelf → Settings → Users → your user → API token"></label>
        <div class="full row"><button class="btn">Save</button><button type="button" class="btn quiet" id="testAbs">Test connection</button></div>
      </form>
    </div>
    <div class="card">
      <h3>Where the library lives</h3>
      <p class="muted">Books are kept on this server in <code>${esc(cfg.library_dir)}</code>, one folder per author and title. Back up that folder plus the <code>kindle-shelf.db</code> file next to it.</p>
    </div>`;
  $("#admin").querySelectorAll("[data-reset]").forEach(b => b.onclick = async () => {
    const pw = prompt("New password (6+ characters):"); if (!pw) return;
    try { await api(`/api/users/${b.dataset.reset}`, { method: "PUT", json: { password: pw } }); toast("Password reset"); } catch (err) { toast(err.message); }
  });
  $("#admin").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Remove this person? Their reading lists are deleted; the books stay.")) return;
    try { await api(`/api/users/${b.dataset.del}`, { method: "DELETE" }); renderAdmin(); } catch (err) { toast(err.message); }
  });
  $("#userForm").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    try { await api("/api/users", { method: "POST", json: { name: f.get("name"), username: f.get("username"), password: f.get("password"),
            kindle_email: f.get("kindle_email") || null, is_admin: !!f.get("is_admin") } }); toast("Added"); renderAdmin(); }
    catch (err) { toast(err.message); }
  };
  $("#mailForm").onsubmit = async e => {
    e.preventDefault();
    try { await api("/api/settings/email", { method: "PUT", json: Object.fromEntries(new FormData(e.target)) });
          cfg = await api("/api/config"); toast("Saved"); }
    catch (err) { toast(err.message); }
  };
  $("#audForm").onsubmit = async e => {
    e.preventDefault();
    try { await api("/api/settings/audio", { method: "PUT", json: Object.fromEntries(new FormData(e.target)) }); toast("Saved"); renderAdmin(); }
    catch (err) { toast(err.message); }
  };
  $("#testAbs").onclick = async () => {
    try { const r = await api("/api/settings/audio/test", { method: "POST" });
          toast("Connected. Libraries: " + r.libraries.map(l => l.name + " (" + l.folders.join(", ") + ")").join("; ")); }
    catch (err) { toast(err.message); }
  };
  $("#testMail").onclick = async e => {
    e.target.disabled = true; e.target.textContent = "Sending…";
    try { const r = await api("/api/settings/email/test", { method: "POST" }); toast("Test email sent to " + r.to); }
    catch (err) { toast(err.message); }
    finally { e.target.disabled = false; e.target.textContent = "Send a test email"; }
  };
}

// ---------------------------------------------------------------- routing
let current = "";
function route() {
  const h = location.hash || "#/";
  const view = h.startsWith("#/add") ? "add" : h.startsWith("#/audio") ? "audio" : h.startsWith("#/settings") ? "settings" : "shelf";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view));
  if (view !== current) {
    current = view; $("#view").innerHTML = "";
    if (view === "add") renderAdd(); else if (view === "audio") renderAudio(); else if (view === "settings") renderSettings(); else renderShelf();
  }
  if (h.startsWith("#/book/")) renderBook(h.slice(7)); else { $("#sheet").innerHTML = ""; editing = false; shown = ""; }
}
async function refresh() {
  books = await api("/api/books");
  if (current === "shelf" && $("#shelf")) drawShelf();
  const h = location.hash;
  if (h.startsWith("#/book/")) renderBook(h.slice(7));
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#scrim")) closeSheet(); });

(async () => {
  [me, cfg] = await Promise.all([api("/api/me"), api("/api/config")]);
  books = await api("/api/books");
  route();
  setInterval(() => { if (books.some(b => BUSY.includes(b.status)) || !document.hidden) refresh().catch(() => {}); }, 4000);
})();
</script>
